

spring.datasource.url=jdbc:h2:mem:skillmatchingApp_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# 3. Désactivation complète de Consul (Évite de chercher le serveur local 8500 en test)
spring.cloud.consul.enabled=false
spring.cloud.consul.discovery.enabled=false
spring.cloud.consul.config.enabled=false

# 4. Remplacement des tokens OAuth2 s'ils ne sont pas injectés dans l'environnement
spring.security.oauth2.client.registration.google.client-id=mock-test-id
spring.security.oauth2.client.registration.google.client-secret=mock-test-secret
spring.security.oauth2.client.registration.github.client-id=mock-test-id
spring.security.oauth2.client.registration.github.client-secret=mock-test-secret

# 5. Désactivation des Circuit Breakers réels pour les tests unitaires/intégration de base
spring.cloud.openfeign.circuitbreaker.enabled=false