version: '3.8'

services:
  # ============================================
  # CONSUL - Service Discovery
  # ============================================
  consul:
    image: hashicorp/consul:1.15.0
    container_name: consul-server-skillmatchpfe
    ports:
      - "8500:8500"
    command: "agent -dev -client 0.0.0.0"
    volumes:
      - consul-data:/consul/data
    networks:
      - skillmatch-network
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # MYSQL - Base de données
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: mysql-skillmatch
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: skillmatchingApp
    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - skillmatch-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # API GATEWAY
  # ============================================
  api-gateway:
    build:
      context: ./skillmatch-api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - spring.cloud.consul.host=consul
      - spring.cloud.consul.port=8500
    depends_on:
      consul:
        condition: service_healthy
    networks:
      - skillmatch-network

  # ============================================
  # AUTH SERVICE
  # ============================================
  auth-service:
    build:
      context: ./skillmatch-auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      - spring.datasource.url=jdbc:mysql://mysql:3306/skillmatchingApp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - spring.datasource.username=root
      - spring.datasource.password=password
      - spring.cloud.consul.host=consul
      - spring.cloud.consul.port=8500
    depends_on:
      consul:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - skillmatch-network

  # ============================================
  # CANDIDAT SERVICE
  # ============================================
  candidat-service:
    build:
      context: ./skillmatch-candidat-service
      dockerfile: Dockerfile
    container_name: candidat-service
    ports:
      - "8082:8082"
    environment:
      - spring.datasource.url=jdbc:mysql://mysql:3306/skillmatchingApp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - spring.datasource.username=root
      - spring.datasource.password=password
      - spring.cloud.consul.host=consul
      - spring.cloud.consul.port=8500
    volumes:
      - ./uploads:/uploads
    depends_on:
      consul:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - skillmatch-network

  # ============================================
  # ENTREPRISE SERVICE
  # ============================================
  entreprise-service:
    build:
      context: ./skillmatch-entreprise-service
      dockerfile: Dockerfile
    container_name: entreprise-service
    ports:
      - "8083:8083"
    environment:
      - spring.datasource.url=jdbc:mysql://mysql:3306/skillmatchingApp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - spring.datasource.username=root
      - spring.datasource.password=password
      - spring.cloud.consul.host=consul
      - spring.cloud.consul.port=8500
    volumes:
      - ./uploads:/uploads
    depends_on:
      consul:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - skillmatch-network

  # ============================================
  # OFFRE SERVICE
  # ============================================
  offre-service:
    build:
      context: ./skillmatch-offres-service
      dockerfile: Dockerfile
    container_name: offre-service
    ports:
      - "8084:8084"
    environment:
      - spring.datasource.url=jdbc:mysql://mysql:3306/skillmatchingApp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - spring.datasource.username=root
      - spring.datasource.password=password
      - spring.cloud.consul.host=consul
      - spring.cloud.consul.port=8500
    depends_on:
      consul:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - skillmatch-network

  # ============================================
  # CANDIDATURE SERVICE
  # ============================================
  candidature-service:
    build:
      context: ./skillmatch-candidature-service
      dockerfile: Dockerfile
    container_name: candidature-service
    ports:
      - "8085:8085"
    environment:
      - spring.datasource.url=jdbc:mysql://mysql:3306/skillmatchingApp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - spring.datasource.username=root
      - spring.datasource.password=password
      - spring.cloud.consul.host=consul
      - spring.cloud.consul.port=8500
    depends_on:
      consul:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - skillmatch-network

  # ============================================
  # FRONTEND
  # ============================================
  frontend:
    build:
      context: ./frontend-skillmatch
      dockerfile: Dockerfile
    container_name: frontend-skillmatch
    ports:
      - "8086:8086"
    environment:
      - api.gateway.url=http://api-gateway:8080
      - spring.cloud.consul.host=consul
      - spring.cloud.consul.port=8500
    depends_on:
      - api-gateway
    networks:
      - skillmatch-network

# ============================================
# VOLUMES
# ============================================
volumes:
  consul-data:
  mysql-data:

# ============================================
# NETWORK
# ============================================
networks:
  skillmatch-network:
    driver: bridge