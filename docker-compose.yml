version: '3.8'

services:
  # ============================================
  # DATABASE SYSTEM (MySQL)
  # ============================================
  mysql:
    image: mysql:8.0.46
    container_name: mysql-skillmatch
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=skillmatchingApp
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - skillmatch-network

  # ============================================
  # SERVICE DISCOVERY (Consul)
  # ============================================
  consul:
    image: hashicorp/consul:1.15.0
    container_name: consul-server-skillmatchpfe
    ports:
      - "8500:8500"
    command: "agent -server -bootstrap-expect=1 -ui -client=0.0.0.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/v1/status/leader"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - skillmatch-network

  # ============================================
  # API GATEWAY
  # ============================================
  api-gateway:
    build:
      context: ./skillmatch-api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
    depends_on:
      consul:
        condition: service_healthy
    networks:
      - skillmatch-network

  # ============================================
  # CORE MICROSERVICES
  # ============================================
  auth-service:
    build:
      context: ./skillmatch-auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_HOST=mysql
      - SPRING_DATASOURCE_DB=skillmatchingApp
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - skillmatch-network

  candidat-service:
    build:
      context: ./skillmatch-candidat-service
    container_name: candidat-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_HOST=mysql
      - SPRING_DATASOURCE_DB=skillmatchingApp
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - skillmatch-network

  entreprise-service:
    build:
      context: ./skillmatch-entreprise-service
    container_name: entreprise-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_HOST=mysql
      - SPRING_DATASOURCE_DB=skillmatchingApp
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - skillmatch-network

  offre-service:
    build:
      context: ./skillmatch-offres-service
    container_name: offre-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_HOST=mysql
      - SPRING_DATASOURCE_DB=skillmatchingApp
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - skillmatch-network

  candidature-service:
    build:
      context: ./skillmatch-candidature-service
    container_name: candidature-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_HOST=mysql
      - SPRING_DATASOURCE_DB=skillmatchingApp
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - skillmatch-network

  # ============================================
  # FRONTEND SYSTEM
  # ============================================
  frontend:
    build:
      context: ./frontend-skillmatch
    image: skillmatch-project-frontend:latest
    container_name: frontend-skillmatch
    ports:
      - "8086:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - API_GATEWAY_URL=http://api-gateway:8080
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
      - SPRING_CLOUD_CONSUL_DISCOVERY_PREFER_IP_ADDRESS=true
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - skillmatch-network

# ============================================
# NETWORKS & VOLUMES CONFIGURATION
# ============================================
networks:
  skillmatch-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local