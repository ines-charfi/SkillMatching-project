server.port=8080
spring.application.name=api-gateway


spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:localhost}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.service-name=${spring.application.name}
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${server.port}
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=15s
spring.cloud.consul.discovery.fail-fast=false

jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}


spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://skillmatch-auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/login/**,/oauth2/**
spring.cloud.gateway.routes[0].filters[0]=RemoveRequestHeader=Cookie


spring.cloud.gateway.routes[1].id=auth-service-admin
spring.cloud.gateway.routes[1].uri=lb://skillmatch-auth-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/admin/**
spring.cloud.gateway.routes[1].filters[0]=RemoveRequestHeader=Cookie


spring.cloud.gateway.routes[2].id=candidat-service
spring.cloud.gateway.routes[2].uri=lb://skillmatch-candidat-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/candidats/**
spring.cloud.gateway.routes[2].filters[0]=JwtAuthenticationFilter


spring.cloud.gateway.routes[3].id=entreprise-service
spring.cloud.gateway.routes[3].uri=lb://skillmatch-entreprise-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/entreprises/**
spring.cloud.gateway.routes[3].filters[0]=RemoveRequestHeader=Cookie


spring.cloud.gateway.routes[4].id=offre-service
spring.cloud.gateway.routes[4].uri=lb://skillmatch-offres-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/offres/**
spring.cloud.gateway.routes[4].filters[0]=RemoveRequestHeader=Cookie


spring.cloud.gateway.routes[5].id=candidature-service
spring.cloud.gateway.routes[5].uri=lb://skillmatch-candidature-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/candidatures/**
spring.cloud.gateway.routes[5].filters[0]=RemoveRequestHeader=Cookie


spring.cloud.gateway.default-filters=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

management.endpoints.web.exposure.include=health,info,gateway

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.tomcat.max-swallow-size=10MB
logging.level.org.springframework.cloud.gateway=DEBUG