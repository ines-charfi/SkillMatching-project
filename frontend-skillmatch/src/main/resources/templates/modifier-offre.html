<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillMatch - Modifier l'offre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- CSS commun du site -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- CSS spécifique à la modification d'offre -->
    <link rel="stylesheet" th:href="@{/css/modifier-offre.css}">
</head>
<body>

<!-- Header avec navigation (déjà intégré) -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="offre-edit-card">
                <h2 class="fw-bold mb-4"> Modifier l'opportunité</h2>
                <p class="text-muted mb-4">Ajustez les détails de votre offre pour optimiser la pertinence du matching avec les candidats.</p>

                <form th:action="@{/offre/update/{id}(id=${offre != null ? offre['id'] : ''})}" method="post">
                    <!-- Correction : un seul champ id -->
                    <input type="hidden" name="id" th:value="${offre != null ? offre['id'] : ''}">

                    <div class="mb-4">
                        <label class="form-label fw-bold">Titre de l'offre</label>
                        <input type="text" name="titre" th:value="${offre != null ? offre['titre'] : ''}" class="form-control form-control-lg" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Description complète</label>
                        <textarea name="description" th:text="${offre != null ? offre['description'] : ''}" class="form-control" rows="6" required></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-bold">Niveau d'études requis</label>
                            <select name="niveauRequis" class="form-select">
                                <option value="Bac+2" th:selected="${offre != null and offre['niveauRequis'] == 'Bac+2'}">Bac+2</option>
                                <option value="Bac+3" th:selected="${offre != null and offre['niveauRequis'] == 'Bac+3'}">Bac+3 (Licence)</option>
                                <option value="Bac+5" th:selected="${offre != null and (offre['niveauRequis'] == 'Bac+5' or offre['niveauRequis'] == null)}">Bac+5 (Master / Ingénieur)</option>
                                <option value="Doctorat" th:selected="${offre != null and offre['niveauRequis'] == 'Doctorat'}">Doctorat</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-bold">Rémunération annuelle</label>
                            <input type="text" name="salaire" th:value="${offre != null ? offre['salaire'] : ''}" class="form-control">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Compétences techniques (Séparées par des virgules)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-tags text-primary"></i></span>
                            <input type="text" name="competencesRequises" th:value="${offre != null ? offre['competencesRequises'] : ''}" class="form-control border-start-0">
                        </div>
                        <div class="form-text mt-2">Modifier ces compétences réévaluera dynamiquement la liste des candidats matchés.</div>
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn btn-success btn-submit-edit">Enregistrer les modifications</button>
                        <a th:href="@{/dashboard-entreprise}" class="btn btn-light btn-cancel-edit">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
