<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SkillMatch - Publier une offre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body style="background-color: #f8fafc;">

<!-- On inclut ton nouveau Header -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm p-4 p-md-5" style="border-radius: 24px;">
                <h2 class="fw-bold mb-4" style="color: #1e1b4b;">🚀 Publier une nouvelle opportunité</h2>
                <p class="text-muted mb-4">Décrivez le poste et les compétences requises pour trouver les meilleurs talents grâce au matching.</p>

                <form th:action="@{/offre/creer}" method="post">

                    <div class="mb-4">
                        <label class="form-label fw-bold">Titre de l'offre</label>
                        <input type="text" name="titre" class="form-control form-control-lg" placeholder="Ex: Développeur Full Stack Java/React" required style="border-radius: 12px; border: 2px solid #f1f5f9; background: #f8fafc;">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Description complète</label>
                        <textarea name="description" class="form-control" rows="6" placeholder="Quelles seront les missions du candidat ?" required style="border-radius: 12px; border: 2px solid #f1f5f9; background: #f8fafc;"></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-bold">Niveau d'études requis</label>
                            <select name="niveauRequis" class="form-select" style="border-radius: 12px; border: 2px solid #f1f5f9; background: #f8fafc; padding: 12px;">
                                <option value="Bac+2">Bac+2</option>
                                <option value="Bac+3">Bac+3 (Licence)</option>
                                <option value="Bac+5" selected>Bac+5 (Master / Ingénieur)</option>
                                <option value="Doctorat">Doctorat</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-bold">Rémunération annuelle</label>
                            <input type="text" name="salaire" class="form-control" placeholder="Ex: 45k - 55k €" style="border-radius: 12px; border: 2px solid #f1f5f9; background: #f8fafc; padding: 12px;">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Compétences techniques (Séparées par des virgules)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-tags text-primary"></i></span>
                            <input type="text" name="competencesRequises" class="form-control border-start-0" placeholder="Java, Spring Boot, React, Docker..." style="border-radius: 0 12px 12px 0; border: 2px solid #f1f5f9; background: #f8fafc; padding: 12px;">
                        </div>
                        <div class="form-text mt-2">L'algorithme utilisera ces mots-clés pour calculer le score de matching.</div>
                    </div>

                    <div style="display: flex; gap: 15px; margin-top: 30px;">
                        <button type="submit" class="btn btn-primary px-5 py-3 fw-bold shadow" style="border-radius: 50px; background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); border: none; flex: 2;">Diffuser l'offre maintenant</button>
                        <a th:href="@{/dashboard-entreprise}" class="btn btn-light px-4 py-3 border" style="border-radius: 50px; flex: 1; font-weight: 600;">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- On inclut ton superbe Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
