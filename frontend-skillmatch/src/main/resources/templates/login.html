<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillMatch - Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body class="login-body">

<div class="bg-circles" aria-hidden="true">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
</div>

<nav class="login-navbar">
    <div class="login-nav-container">
        <a th:href="@{/}" class="login-logo">
            <img th:src="@{/img/logo.png}" alt="SkillMatch Logo" class="login-logo-img">
        </a>
        <a th:href="@{/}" class="btn-home">
            <i class="bi bi-house-door-fill"></i> Accueil
        </a>
    </div>
</nav>

<main class="login-wrapper">
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="logo-icon"><i class="bi bi-lightning-charge-fill"></i></div>
            <h2 class="login-card-title">Bienvenue</h2>
            <p class="text-muted small">Connectez-vous à votre espace</p>
        </div>

        <div th:if="${error}" class="alert alert-danger custom-alert">
            <i class="bi bi-exclamation-circle-fill me-2"></i> <span th:text="${error}"></span>
        </div>
        <div th:if="${message}" class="alert alert-success custom-alert">
            <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${message}"></span>
        </div>
        <div th:if="${successMessage}" class="alert alert-success custom-alert">
            <i class="bi bi-patch-check-fill me-2"></i> <span th:text="${successMessage}"></span>
        </div>

        <div class="role-selector" role="group" aria-label="Sélection du profil d'accès">
            <button type="button" class="role-btn active" id="btnCandidat" onclick="selectRole('CANDIDAT')">Candidat</button>
            <button type="button" class="role-btn" id="btnEntreprise" onclick="selectRole('ENTREPRISE')">Entreprise</button>
            <button type="button" class="role-btn" id="btnAdmin" onclick="selectRole('ADMIN')">Admin</button>
        </div>

        <form th:action="@{/login}" method="post" id="formLogin" onsubmit="startLoading()">
            <input type="hidden" name="role" id="roleInput" value="CANDIDAT">

            <div class="mb-3">
                <label class="form-label field-label">Adresse Email</label>
                <div class="input-group custom-input-group">
                    <span class="input-group-text addon-left"><i class="bi bi-envelope text-muted"></i></span>
                    <input type="email" class="form-control input-middle" name="email" placeholder="nom@exemple.com" required>
                </div>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label field-label mb-0">Mot de passe</label>
                    <a th:href="@{/forgot-password}" class="forgot-password-link">Oublié ?</a>
                </div>
                <div class="input-group custom-input-group">
                    <span class="input-group-text addon-left"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" class="form-control input-middle" name="password" id="password" placeholder="••••••••" required>
                    <span class="input-group-text addon-right" onclick="togglePassword()" role="button" aria-label="Afficher/Masquer le mot de passe">
                            <i class="bi bi-eye text-muted" id="eyeIcon"></i>
                        </span>
                </div>
            </div>

            <button type="submit" class="btn btn-login w-100" id="submitBtn">
                <span class="btn-text">Se connecter</span>
                <div class="spinner-border spinner-border-sm text-light d-none" role="status"></div>
            </button>
        </form>

        <div class="text-center mt-4">
            <p class="social-divider-text">Ou continuer avec</p>
            <div class="d-flex gap-2">
                <a th:href="@{/oauth2/authorization/google}" class="btn btn-oauth w-50">
                    <i class="bi bi-google text-danger me-2"></i>Google
                </a>
                <a th:href="@{/oauth2/authorization/github}" class="btn btn-oauth w-50">
                    <i class="bi bi-github me-2"></i>GitHub
                </a>
            </div>
        </div>

        <p class="text-center mt-4 mb-0 small text-muted">
            Pas de compte ? <a th:href="@{/register}" class="register-redirect-link">Créer un profil</a>
        </p>
    </div>
</main>

<script>
    function selectRole(role) {
        document.getElementById('roleInput').value = role;
        document.getElementById('btnCandidat').classList.toggle('active', role === 'CANDIDAT');
        document.getElementById('btnEntreprise').classList.toggle('active', role === 'ENTREPRISE');
        document.getElementById('btnAdmin').classList.toggle('active', role === 'ADMIN');
    }

    function togglePassword() {
        const input = document.getElementById('password');
        const icon = document.getElementById('eyeIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('bi-eye-slash', 'bi-eye');
        }
    }

    function startLoading() {
        const btn = document.getElementById('submitBtn');
        btn.classList.add('loading');
        const spinner = btn.querySelector('.spinner-border');
        const btnText = btn.querySelector('.btn-text');
        if(spinner && btnText) {
            spinner.classList.remove('d-none');
            btnText.textContent = "Connexion...";
        }
        setTimeout(() => { btn.disabled = true; }, 50);
    }
</script>
</body>
</html>
