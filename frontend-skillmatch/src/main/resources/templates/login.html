<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillMatch - Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body {
            background: var(--gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
        }

        /* Arrière-plan animé pour l'effet "PFE Wahou" */
        .bg-circles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; z-index: -1;
        }
        .circle {
            position: absolute; background: rgba(255, 255, 255, 0.1);
            border-radius: 50%; animation: animate 25s linear infinite; bottom: -150px;
        }
        @keyframes animate {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; border-radius: 0; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; border-radius: 50%; }
        }

        .login-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.3s ease;
        }

        .logo-icon {
            width: 60px; height: 60px;
            background: var(--gradient);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; color: white; margin: 0 auto 15px;
        }

        .role-selector {
            background: #f1f5f9;
            padding: 5px;
            border-radius: 14px;
            display: flex;
            margin-bottom: 25px;
        }

        .role-btn {
            flex: 1; border: none; padding: 10px; border-radius: 10px;
            font-weight: 600; color: #64748b; background: transparent;
            transition: 0.3s; font-size: 14px;
        }

        .role-btn.active {
            background: white; color: var(--primary);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .form-control {
            border-radius: 12px; padding: 12px 15px;
            border: 2px solid #e2e8f0; background: #f8fafc;
        }

        .form-control:focus {
            border-color: var(--primary); box-shadow: none; background: white;
        }

        .btn-login {
            background: var(--gradient); border: none; border-radius: 12px;
            padding: 14px; font-weight: 700; color: white;
            transition: 0.3s; margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4);
        }

        /* Animation de chargement */
        .loading .spinner-border { display: inline-block !important; }
        .loading .btn-text { display: none; }
    </style>
</head>
<body>

<div class="bg-circles">
    <div class="circle" style="width: 80px; height: 80px; left: 10%; animation-delay: 0s;"></div>
    <div class="circle" style="width: 120px; height: 120px; left: 70%; animation-delay: 3s;"></div>
    <div class="circle" style="width: 50px; height: 50px; left: 40%; animation-delay: 7s;"></div>
</div>

<div class="login-card">
    <div class="text-center mb-4">
        <div class="logo-icon"><i class="bi bi-lightning-charge-fill"></i></div>
        <h2 class="fw-bold text-dark mb-1">SkillMatch</h2>
        <p class="text-muted small">Connectez-vous à votre espace recrutement</p>
    </div>

    <!-- Alertes -->
    <div th:if="${error}" class="alert alert-danger border-0 small mb-4" style="border-radius: 12px;">
        <i class="bi bi-exclamation-circle-fill me-2"></i> <span th:text="${error}"></span>
    </div>
    <div th:if="${message}" class="alert alert-success border-0 small mb-4" style="border-radius: 12px;">
        <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${message}"></span>
    </div>
    <div th:if="${successMessage}" class="alert alert-success border-0 small mb-4" style="border-radius: 12px;">
        <i class="bi bi-patch-check-fill me-2"></i> <span th:text="${successMessage}"></span>
    </div>

    <!-- Sélecteur de rôle -->
    <div class="role-selector">
        <button type="button" class="role-btn active" id="btnCandidat" onclick="selectRole('CANDIDAT')">Candidat</button>
        <button type="button" class="role-btn" id="btnEntreprise" onclick="selectRole('ENTREPRISE')">Entreprise</button>
    </div>

    <form th:action="@{/login}" method="post" id="formLogin" onsubmit="startLoading()">
        <input type="hidden" name="role" id="roleInput" value="CANDIDAT">

        <div class="mb-3">
            <label class="form-label small fw-bold text-muted">Adresse Email</label>
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0" style="border-radius: 12px 0 0 12px;"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" class="form-control border-start-0" name="email" placeholder="nom@exemple.com" required>
            </div>
        </div>

        <div class="mb-3">
            <div class="d-flex justify-content-between">
                <label class="form-label small fw-bold text-muted">Mot de passe</label>
                <a th:href="@{/forgot-password}" class="small text-decoration-none" style="color: var(--primary);">Oublié ?</a>
            </div>
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0" style="border-radius: 12px 0 0 12px;"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" class="form-control border-start-0 border-end-0" name="password" id="password" placeholder="••••••••" required>
                <span class="input-group-text bg-white border-start-0" style="border-radius: 0 12px 12px 0; cursor: pointer;" onclick="togglePassword()">
                    <i class="bi bi-eye text-muted" id="eyeIcon"></i>
                </span>
            </div>
        </div>

        <button type="submit" class="btn btn-login w-100" id="submitBtn">
            <span class="btn-text">Se connecter</span>
            <div class="spinner-border spinner-border-sm text-light d-none" role="status"></div>
        </button>
    </form>

    <div class="text-center mt-4">
        <p class="small text-muted">Ou continuer avec</p>
        <div class="d-flex gap-2">
            <a th:href="@{/oauth2/authorization/google}" class="btn btn-light border w-50 small fw-bold" style="border-radius: 10px;">
                <i class="bi bi-google text-danger me-2"></i>Google
            </a>
            <a th:href="@{/oauth2/authorization/github}" class="btn btn-light border w-50 small fw-bold" style="border-radius: 10px;">
                <i class="bi bi-github me-2"></i>GitHub
            </a>
        </div>
    </div>

    <p class="text-center mt-4 mb-0 small text-muted">
        Pas de compte ? <a th:href="@{/register}" class="fw-bold text-primary text-decoration-none">Créer un profil</a>
    </p>
</div>

<script>
    function selectRole(role) {
        document.getElementById('roleInput').value = role;
        document.getElementById('btnCandidat').classList.toggle('active', role === 'CANDIDAT');
        document.getElementById('btnEntreprise').classList.toggle('active', role === 'ENTREPRISE');
    }

    function togglePassword() {
        const input = document.getElementById('password');
        const icon = document.getElementById('eyeIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('bi-eye-slash', 'bi-eye');
        }
    }

    function startLoading() {
        const btn = document.getElementById('submitBtn');
        btn.classList.add('loading');
        // Laissez le bouton actif une fraction de seconde pour permettre au navigateur de soumettre la requête
        setTimeout(() => {
            btn.disabled = true;
        }, 50);
    }
</script>
</body>
</html>
