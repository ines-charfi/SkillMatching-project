<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillMatch - Connexion</title>
    <!-- Bootstrap + Icons + Google Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- CSS commun du site -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- CSS spécifique à la page login -->
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<!-- Arrière‑plan animé (cercles) -->
<div class="bg-circles">
    <div class="circle" style="width: 80px; height: 80px; left: 10%; animation-delay: 0s;"></div>
    <div class="circle" style="width: 120px; height: 120px; left: 70%; animation-delay: 3s;"></div>
    <div class="circle" style="width: 50px; height: 50px; left: 40%; animation-delay: 7s;"></div>
</div>

<!-- Barre de navigation simplifiée (logo + bouton Accueil) -->
<nav class="login-navbar">
    <div class="login-nav-container">
        <a th:href="@{/}" class="login-logo">
            <img th:src="@{/img/logo.png}" alt="SkillMatch Logo" class="login-logo-img">
        </a>
        <a th:href="@{/}" class="btn-home">
            <i class="bi bi-house-door-fill"></i> Accueil
        </a>
    </div>
</nav>

<!-- Carte de connexion -->
<div class="login-card">
    <div class="text-center mb-4">
        <div class="logo-icon"><i class="bi bi-lightning-charge-fill"></i></div>
        <h2 class="fw-bold text-dark mb-1">Bienvenue</h2>
        <p class="text-muted small">Connectez-vous à votre espace</p>
    </div>

    <!-- Alertes (messages d'erreur, succès) -->
    <div th:if="${error}" class="alert alert-danger border-0 small mb-4" style="border-radius: 12px;">
        <i class="bi bi-exclamation-circle-fill me-2"></i> <span th:text="${error}"></span>
    </div>
    <div th:if="${message}" class="alert alert-success border-0 small mb-4" style="border-radius: 12px;">
        <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${message}"></span>
    </div>
    <div th:if="${successMessage}" class="alert alert-success border-0 small mb-4" style="border-radius: 12px;">
        <i class="bi bi-patch-check-fill me-2"></i> <span th:text="${successMessage}"></span>
    </div>

    <!-- Sélecteur de rôle -->
    <div class="role-selector">
        <button type="button" class="role-btn active" id="btnCandidat" onclick="selectRole('CANDIDAT')">Candidat</button>
        <button type="button" class="role-btn" id="btnEntreprise" onclick="selectRole('ENTREPRISE')">Entreprise</button>
        <button type="button" class="role-btn" id="btnAdmin" onclick="selectRole('ADMIN')">Admin</button>
    </div>

    <form th:action="@{/login}" method="post" id="formLogin" onsubmit="startLoading()">
        <input type="hidden" name="role" id="roleInput" value="CANDIDAT">

        <div class="mb-3">
            <label class="form-label small fw-bold text-muted">Adresse Email</label>
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0" style="border-radius: 12px 0 0 12px;"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" class="form-control border-start-0" name="email" placeholder="nom@exemple.com" required>
            </div>
        </div>

        <div class="mb-3">
            <div class="d-flex justify-content-between">
                <label class="form-label small fw-bold text-muted">Mot de passe</label>
                <a th:href="@{/forgot-password}" class="small text-decoration-none" style="color: var(--primary);">Oublié ?</a>
            </div>
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0" style="border-radius: 12px 0 0 12px;"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" class="form-control border-start-0 border-end-0" name="password" id="password" placeholder="••••••••" required>
                <span class="input-group-text bg-white border-start-0" style="border-radius: 0 12px 12px 0; cursor: pointer;" onclick="togglePassword()">
                    <i class="bi bi-eye text-muted" id="eyeIcon"></i>
                </span>
            </div>
        </div>

        <button type="submit" class="btn btn-login w-100" id="submitBtn">
            <span class="btn-text">Se connecter</span>
            <div class="spinner-border spinner-border-sm text-light d-none" role="status"></div>
        </button>
    </form>

    <div class="text-center mt-4">
        <p class="small text-muted">Ou continuer avec</p>
        <div class="d-flex gap-2">
            <a th:href="@{/oauth2/authorization/google}" class="btn btn-light border w-50 small fw-bold" style="border-radius: 10px;">
                <i class="bi bi-google text-danger me-2"></i>Google
            </a>
            <a th:href="@{/oauth2/authorization/github}" class="btn btn-light border w-50 small fw-bold" style="border-radius: 10px;">
                <i class="bi bi-github me-2"></i>GitHub
            </a>
        </div>
    </div>

    <p class="text-center mt-4 mb-0 small text-muted">
        Pas de compte ? <a th:href="@{/register}" class="fw-bold text-primary text-decoration-none">Créer un profil</a>
    </p>
</div>

<script>
    function selectRole(role) {
        document.getElementById('roleInput').value = role;
        document.getElementById('btnCandidat').classList.toggle('active', role === 'CANDIDAT');
        document.getElementById('btnEntreprise').classList.toggle('active', role === 'ENTREPRISE');
        document.getElementById('btnAdmin').classList.toggle('active', role === 'ADMIN');
    }

    function togglePassword() {
        const input = document.getElementById('password');
        const icon = document.getElementById('eyeIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('bi-eye-slash', 'bi-eye');
        }
    }

    function startLoading() {
        const btn = document.getElementById('submitBtn');
        btn.classList.add('loading');
        setTimeout(() => { btn.disabled = true; }, 50);
    }
</script>
</body>
</html>
