<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillMatch - Inscription</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .register-card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
        }
        .role-card {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .role-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }
        .role-card.selected {
            border-color: #667eea;
            background: #f0f0ff;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="register-card mx-auto">
        <h2 class="text-center mb-4">📝 Créer un compte</h2>

        <form id="registerForm">
            <!-- Sélection du rôle -->
            <div class="mb-4">
                <label class="form-label fw-bold">Je suis :</label>
                <div class="row">
                    <div class="col-6">
                        <div class="role-card text-center selected" data-role="CANDIDAT"
                             onclick="selectRole('CANDIDAT', this)">
                            <i class="bi bi-person-circle display-4"></i>
                            <h5 class="mt-2">Candidat</h5>
                            <p class="text-muted small">Je cherche un emploi</p>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="role-card text-center" data-role="ENTREPRISE"
                             onclick="selectRole('ENTREPRISE', this)">
                            <i class="bi bi-building display-4"></i>
                            <h5 class="mt-2">Entreprise</h5>
                            <p class="text-muted small">Je recrute</p>
                        </div>
                    </div>
                </div>
                <input type="hidden" id="selectedRole" value="CANDIDAT">
            </div>

            <!-- Champs communs -->
            <div class="mb-3">
                <label class="form-label">Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email"
                           placeholder="vous@exemple.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Mot de passe</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password"
                           placeholder="Minimum 6 caractères" minlength="6" required>
                </div>
            </div>

            <!-- Champs spécifiques au rôle -->
            <div id="candidatFields">
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label">Prénom</label>
                        <input type="text" class="form-control" id="prenom"
                               placeholder="Paul">
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label">Nom</label>
                        <input type="text" class="form-control" id="nom"
                               placeholder="Dupont">
                    </div>
                </div>
            </div>

            <div id="entrepriseFields" style="display: none;">
                <div class="mb-3">
                    <label class="form-label">Nom de l'entreprise</label>
                    <input type="text" class="form-control" id="nomEntreprise"
                           placeholder="TechCorp">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mt-3">
                <i class="bi bi-person-plus"></i> S'inscrire
            </button>
        </form>

        <div class="text-center mt-4">
            <p>Ou inscrivez-vous avec :</p>
            <a th:href="@{/oauth2/authorization/google}" class="btn btn-outline-dark me-2">
                <i class="bi bi-google"></i> Google
            </a>
            <a th:href="@{/oauth2/authorization/github}" class="btn btn-outline-dark">
                <i class="bi bi-github"></i> GitHub
            </a>
        </div>

        <p class="text-center mt-4">
            Déjà un compte ? <a href="/login" class="text-decoration-none">Se connecter</a>
        </p>
    </div>
</div>

<script>
    let selectedRole = 'CANDIDAT';

    function selectRole(role, element) {
        selectedRole = role;
        document.getElementById('selectedRole').value = role;

        // Mise à jour visuelle
        document.querySelectorAll('.role-card').forEach(card => {
            card.classList.remove('selected');
        });
        element.classList.add('selected');

        // Afficher/masquer les champs spécifiques
        document.getElementById('candidatFields').style.display =
            role === 'CANDIDAT' ? 'block' : 'none';
        document.getElementById('entrepriseFields').style.display =
            role === 'ENTREPRISE' ? 'block' : 'none';
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            role: selectedRole
        };

        // Ajouter les champs spécifiques
        if (selectedRole === 'CANDIDAT') {
            formData.nom = document.getElementById('nom').value;
            formData.prenom = document.getElementById('prenom').value;
        } else {
            formData.nomEntreprise = document.getElementById('nomEntreprise').value;
        }

        try {
            const response = await fetch('http://localhost:8080/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem('token', data.token);
                alert('Inscription réussie !');
                window.location.href = '/dashboard';
            } else {
                alert(data.message || 'Erreur d\'inscription');
            }
        } catch (error) {
            console.error('Erreur:', error);
            alert('Erreur de connexion au serveur');
        }
    });
</script>
</body>
</html>
