<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillMatch - Inscription</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2=family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body class="register-body">

<nav class="register-navbar">
    <div class="register-nav-container">
        <a th:href="@{/}" class="register-logo">
            <img th:src="@{/img/logo.png}" alt="SkillMatch Logo" class="register-logo-img">
            <span class="register-logo-text">SkillMatch</span>
        </a>
        <a th:href="@{/}" class="btn-home">
            <i class="bi bi-house-door-fill"></i> Accueil
        </a>
    </div>
</nav>

<main class="register-wrapper">
    <div class="register-card">
        <img th:src="@{/img/logo.png}" alt="SkillMatch Logo" class="navbar-logo-img">
        <h2 class="register-title">Créer un compte</h2>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/register}" method="post">

            <div class="mb-4">
                <label class="form-label role-label">Je suis :</label>
                <div class="row g-3">
                    <div class="col-6">
                        <div class="role-card card-candidat selected" id="cardCandidat" onclick="selectRole('CANDIDAT')">
                            <i class="bi bi-person-circle role-icon text-primary"></i>
                            <h6 class="mt-2 fw-bold">Candidat</h6>
                            <p class="text-muted small mb-0">Je cherche un job</p>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="role-card card-entreprise" id="cardEntreprise" onclick="selectRole('ENTREPRISE')">
                            <i class="bi bi-building role-icon text-success"></i>
                            <h6 class="mt-2 fw-bold">Entreprise</h6>
                            <p class="text-muted small mb-0">Je recrute</p>
                        </div>
                    </div>
                </div>
                <input type="hidden" name="role" id="selectedRole" value="CANDIDAT">
            </div>

            <div class="mb-3">
                <label class="form-label field-label">Email</label>
                <input type="email" class="form-control custom-input" name="email" placeholder="vous@exemple.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label field-label">Mot de passe</label>
                <input type="password" class="form-control custom-input" name="password" placeholder="Min. 6 caractères" minlength="6" required>
            </div>

            <div id="candidatFields" class="conditional-fields">
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label field-label">Prénom</label>
                        <input type="text" class="form-control custom-input" name="prenom" id="inputPrenom" placeholder="Paul">
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label field-label">Nom</label>
                        <input type="text" class="form-control custom-input" name="nom" id="inputNom" placeholder="Dupont">
                    </div>
                </div>
            </div>

            <div id="entrepriseFields" class="conditional-fields hidden-fields">
                <div class="mb-3">
                    <label class="form-label field-label">Nom de l'entreprise</label>
                    <input type="text" class="form-control custom-input" name="nomEntreprise" id="inputEntreprise" placeholder="TechCorp">
                </div>
            </div>

            <button type="submit" class="btn-register w-100 mt-2">
                <i class="bi bi-person-plus-fill me-2"></i> Créer mon compte
            </button>
        </form>

        <div class="text-center mt-4">
            <p class="social-divider-text">Ou inscrivez-vous avec :</p>
            <div class="d-flex justify-content-center gap-2">
                <a th:href="@{/oauth2/authorization/google}" class="btn btn-oauth">
                    <i class="bi bi-google text-danger"></i> Google
                </a>
                <a th:href="@{/oauth2/authorization/github}" class="btn btn-oauth">
                    <i class="bi bi-github text-dark"></i> GitHub
                </a>
            </div>
        </div>

        <p class="text-center mt-4 mb-0 small">
            Déjà inscrit ? <a th:href="@{/login}" class="login-redirect-link">Se connecter</a>
        </p>
    </div>
</main>

<script>
    function selectRole(role) {
        document.getElementById('selectedRole').value = role;

        const cardC = document.getElementById('cardCandidat');
        const cardE = document.getElementById('cardEntreprise');
        const candidatFields = document.getElementById('candidatFields');
        const entrepriseFields = document.getElementById('entrepriseFields');

        if (role === 'CANDIDAT') {
            cardC.classList.add('selected');
            cardE.classList.remove('selected');
            candidatFields.classList.remove('hidden-fields');
            entrepriseFields.classList.add('hidden-fields');
            document.getElementById('inputPrenom').required = true;
            document.getElementById('inputNom').required = true;
            document.getElementById('inputEntreprise').required = false;
        } else {
            cardE.classList.add('selected');
            cardC.classList.remove('selected');
            candidatFields.classList.add('hidden-fields');
            entrepriseFields.classList.remove('hidden-fields');
            document.getElementById('inputPrenom').required = false;
            document.getElementById('inputNom').required = false;
            document.getElementById('inputEntreprise').required = true;
        }
    }
    window.onload = () => selectRole('CANDIDAT');
</script>
</body>
</html>
