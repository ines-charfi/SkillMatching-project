<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Candidatures - SkillMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- CSS commun du site -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- CSS spécifique à la page Mes Candidatures -->
    <link rel="stylesheet" th:href="@{/css/mes-candidatures.css}">
</head>
<body>

<!-- Header avec navigation (le fragment contient déjà le logo et les liens) -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="container py-5">
    <h2 class="fw-bold mb-4"> Mes Candidatures envoyées</h2>

    <div th:each="c : ${candidatures}" class="cand-card border-start border-4"
         th:styleappend="${c.statut == 'ACCEPTE' ? 'border-color:#10b981' : (c.statut == 'REFUSE' ? 'border-color:#ef4444' : 'border-color:#f59e0b')}">
        <div class="row align-items-center">
            <div class="col-md-6">
                <h4 class="fw-bold mb-1" th:text="${c.offreTitre}">Titre du Poste</h4>
                <p class="text-primary fw-bold mb-0">🏢 <span th:text="${c.entrepriseNom}">Entreprise</span></p>
                <small class="text-muted">Postulé le : <span th:text="${#temporals.format(c.datePostulation, 'dd/MM/yyyy')}">Date</span></small>
            </div>
            <div class="col-md-3 text-center">
                <div class="h5 fw-bold mb-0" th:text="${c.scoreMatching + '%'}">88%</div>
                <div class="small text-muted">Score Matching</div>
            </div>
            <div class="col-md-3 text-end">
                <span th:class="${c.statut == 'ACCEPTE' ? 'status-badge bg-success bg-opacity-10 text-success' : (c.statut == 'REFUSE' ? 'status-badge bg-danger bg-opacity-10 text-danger' : 'status-badge bg-warning bg-opacity-10 text-warning')}"
                      th:text="${c.statut}">EN ATTENTE</span>
            </div>
        </div>
    </div>

    <div th:if="${candidatures.isEmpty()}" class="text-center p-5 bg-white rounded-4">
        <i class="bi bi-inbox fs-1 text-muted"></i>
        <p class="mt-3">Vous n'avez pas encore postulé à des offres.</p>
        <a href="/offre" class="btn btn-primary rounded-pill">Chercher un job</a>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
