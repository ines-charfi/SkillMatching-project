<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Candidatures - SkillMatch</title>

    <!-- Bibliothèques Externes -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- CSS Global (Variables root, navbar, footer) -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- CSS Spécifique à cette page -->
    <link rel="stylesheet" th:href="@{/css/mes-candidatures.css}">
</head>
<body>

<!-- HEADER (Fragment dynamique) -->
<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <!-- Titre de la page -->
    <header class="mb-5">
        <h2 class="fw-bold page-main-title">
            <i class="bi bi-journal-check text-primary me-2"></i>Mes Candidatures envoyées
        </h2>
        <p class="text-muted">Suivez en temps réel l'état de vos demandes d'emploi.</p>
    </header>

    <!-- Liste des Candidatures -->
    <div th:if="${not #lists.isEmpty(candidatures)}">
        <div th:each="c : ${candidatures}"
             class="cand-card"
             th:classappend="${c.statut == 'ACCEPTE' ? 'border-success' : (c.statut == 'REFUSE' ? 'border-danger' : 'border-warning')}">

            <div class="row align-items-center gy-3">
                <!-- Section 1 : Informations sur le poste -->
                <div class="col-12 col-md-6">
                    <h4 class="cand-title fw-bold mb-1" th:text="${c.offreTitre}">Titre du Poste</h4>
                    <p class="cand-company text-primary fw-bold mb-1">
                        <i class="bi bi-building me-1"></i>
                        <span th:text="${c.entrepriseNom}">Nom de l'entreprise</span>
                    </p>
                    <div class="cand-date text-muted small">
                        <i class="bi bi-calendar3 me-1"></i>
                        Postulé le : <span th:text="${#temporals.format(c.datePostulation, 'dd MMMM yyyy')}">01 Janvier 2024</span>
                    </div>
                </div>

                <!-- Section 2 : Score de Matching -->
                <div class="col-6 col-md-3 text-md-center border-start-md">
                    <div class="score-container">
                        <div class="score-value h4 fw-bold mb-0" th:text="${c.scoreMatching + '%'}">0%</div>
                        <div class="score-label text-muted">Matching</div>
                    </div>
                </div>

                <!-- Section 3 : Statut de la candidature -->
                <div class="col-6 col-md-3 text-end">
                        <span class="status-badge"
                              th:classappend="${c.statut == 'ACCEPTE' ? 'status-accepted' : (c.statut == 'REFUSE' ? 'status-refused' : 'status-pending')}"
                              th:text="${c.statut}">
                            EN ATTENTE
                        </span>
                </div>
            </div>
        </div>
    </div>

    <!-- État vide (Si aucune candidature) -->
    <div th:if="${#lists.isEmpty(candidatures)}" class="empty-state text-center p-5 shadow-sm bg-white">
        <div class="empty-icon mb-3">
            <i class="bi bi-inbox fs-1 text-muted"></i>
        </div>
        <h4 class="fw-bold">Aucune candidature pour le moment</h4>
        <p class="text-muted mb-4">Il semble que vous n'ayez pas encore postulé aux offres disponibles.</p>
        <a th:href="@{/offres}" class="btn btn-primary rounded-pill px-4 py-2 fw-bold">
            <i class="bi bi-search me-2"></i>Parcourir les offres
        </a>
    </div>
</main>

<!-- FOOTER (Fragment dynamique) -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Scripts Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
