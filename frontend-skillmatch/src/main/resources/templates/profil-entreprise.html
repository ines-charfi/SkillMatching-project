<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillMatch - Profil Entreprise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-navbar: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            --gray-50: #f9fafb;
            --gray-200: #e5e7eb;
            --gray-800: #111827;
            --radius: 20px;
            --radius-sm: 12px;
            --shadow-md: 0 10px 30px rgba(0,0,0,0.02);
            --shadow-xl: 0 20px 40px rgba(79,70,229,0.12);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--gray-50);
            color: #4b5563;
        }

        .navbar-custom {
            background: var(--gradient-navbar);
            padding: 15px 40px;
        }

        .form-card {
            background: white;
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--gray-200);
            transition: box-shadow 0.3s;
        }

        .form-card:hover {
            box-shadow: var(--shadow-xl);
        }

        .logo-container {
            width: 100px;
            height: 100px;
            background: rgba(79, 70, 229, 0.05);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            color: var(--primary);
            margin: 0 auto 20px;
            border: 2px dashed #c7d2fe;
        }

        .section-separator {
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #10b981;
            margin-top: 35px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-separator::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background: var(--gray-200);
        }

        .form-label {
            font-weight: 600;
            color: var(--gray-800);
            font-size: 14px;
            margin-bottom: 6px;
        }

        .form-control {
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            border: 2px solid var(--gray-200);
            background-color: var(--gray-50);
            font-size: 15px;
            transition: all 0.2s;
        }

        .form-control:focus {
            background-color: white;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.08);
            outline: none;
        }

        .btn-pill {
            padding: 12px 35px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.3s;
        }

        .btn-pill-primary {
            background: var(--gradient);
            color: white;
            border: none;
        }

        .btn-pill-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.25);
            color: white;
        }

        .btn-pill-outline {
            background: transparent;
            border: 2px solid var(--gray-200);
            color: #6b7280;
        }

        .btn-pill-outline:hover {
            background: var(--gray-50);
            color: var(--gray-800);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-custom navbar-dark mb-5">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <a class="navbar-brand fw-bold text-white text-decoration-none fs-4" href="/dashboard">
            <i class="bi bi-lightning-charge-fill text-warning me-2"></i>SkillMatch
        </a>
        <a href="/dashboard-entreprise" class="btn btn-outline-light btn-pill btn-sm px-3 py-1">
            <i class="bi bi-arrow-left me-1"></i> Dashboard Recruteur
        </a>
    </div>
</nav>

<div class="container pb-5" style="max-width: 850px;">
    <div class="form-card">

        <div class="text-center mb-4">
            <div class="logo-container">
                <i class="bi bi-building-fill-gear"></i>
            </div>
            <h2 class="fw-bold text-dark mb-1" th:text="${profil != null ? profil['nomEntreprise'] : 'Identité Entreprise'}">Nom Entreprise</h2>
            <p class="text-muted small">Mettez en valeur votre marque employeur pour attirer les meilleurs profils.</p>
        </div>

        <form th:action="@{/profil-entreprise/update}" method="post" enctype="multipart/form-data">

            <div class="section-separator">Fiche d'identité</div>

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Raison sociale / Nom *</label>
                    <input type="text" name="nomEntreprise" class="form-control" th:value="${profil != null ? profil['nomEntreprise'] : ''}" required placeholder="Ex: SkillMatch Corp">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Secteur d'activité</label>
                    <input type="text" name="secteur" class="form-control" th:value="${profil != null ? profil['secteur'] : ''}" placeholder="Ex: Technologies / IA">
                </div>
                <div class="col-12">
                    <label class="form-label">Description générale & valeurs</label>
                    <textarea name="description" class="form-control" rows="4" th:text="${profil != null ? profil['description'] : ''}" placeholder="Partagez l'ambition et l'environnement de travail de votre entreprise..."></textarea>
                </div>
            </div>

            <div class="section-separator">Coordonnées & Siège</div>

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Adresse e-mail RH</label>
                    <input type="email" name="contactEmail" class="form-control" th:value="${profil != null ? profil['contactEmail'] : ''}" placeholder="recrutement@entreprise.com">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Téléphone standard</label>
                    <input type="tel" name="telephone" class="form-control" th:value="${profil != null ? profil['telephone'] : ''}" placeholder="+212 500-000000">
                </div>
                <div class="col-md-8">
                    <label class="form-label">Lien site vitrine</label>
                    <input type="url" name="siteWeb" class="form-control" th:value="${profil != null ? profil['siteWeb'] : ''}" placeholder="https://www.entreprise.com">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Ville du siège</label>
                    <input type="text" name="ville" class="form-control" th:value="${profil != null ? profil['ville'] : ''}" placeholder="Ex: Casablanca">
                </div>
            </div>

            <div class="section-separator">Identité Graphique</div>

            <div class="mb-5">
                <label class="form-label">Logo corporatif (PNG ou JPG)</label>
                <input type="file" name="logo" class="form-control" accept="image/*">
                <div th:if="${profil != null and profil['logoPath'] != null}" class="mt-2 text-primary small d-flex align-items-center gap-1">
                    <i class="bi bi-file-earmark-image"></i> Fichier actif actuellement : <span class="fw-semibold" th:text="${profil['logoPath']}">logo.png</span>
                </div>
            </div>

            <div class="d-flex flex-column flex-sm-row justify-content-end gap-3 pt-3 border-top">
                <a href="/dashboard-entreprise" class="btn btn-pill btn-pill-outline text-center">Annuler</a>
                <button type="submit" class="btn btn-pill btn-pill-primary">Enregistrer les modifications</button>
            </div>
        </form>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
