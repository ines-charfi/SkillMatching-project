<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillMatch - Offres d'emploi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/liste-offre.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="page-title">Offres d'emploi</h1>
        <div th:if="${session.user_role == 'ENTREPRISE'}">
            <a href="/offre/nouveau" class="btn btn-primary rounded-pill">Publier une offre</a>
        </div>
    </div>

    <!-- Barre de recherche -->
    <div class="search-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Titre, compétence, entreprise..." onkeyup="filterOffres()">
    </div>

    <!-- Liste des offres gérée par Thymeleaf -->
    <div class="offres-list" id="offresList">

        <div th:if="${offres == null or offres.isEmpty()}" class="text-center p-5 text-muted">
            <h3>Aucune offre trouvée</h3>
        </div>

        <!-- Boucle sur tes classes CSS : .offre-card -->
        <div th:each="o : ${offres}" class="offre-card" th:data-search="${o['titre'] + ' ' + o['entrepriseNom']}">
            <div class="offre-header">
                <div>
                    <h3 class="offre-title" th:text="${o['titre']}">Titre</h3>
                    <p class="offre-company">🏢 <span th:text="${o['entrepriseNom']}">Entreprise</span> • <span th:text="${o['ville'] ?: 'France'}">Ville</span></p>
                </div>
                <span class="offre-salaire" th:text="${o['salaire'] ?: 'A négocier'}">Salaire</span>
            </div>

            <p class="offre-description" th:text="${#strings.abbreviate(o['description'], 200)}">Description...</p>

            <div class="offre-skills">
                <span th:if="${o['competencesRequises'] != null}"
                      th:each="skill : ${#strings.arraySplit(o['competencesRequises'], ',')}"
                      class="skill-tag" th:text="${skill.trim()}">Skill</span>
            </div>

            <div class="offre-footer">
                <div class="text-muted small">🎓 Niveau : <span th:text="${o['niveauRequis'] ?: 'N/C'}"></span></div>

                <div th:if="${session.user_role == 'CANDIDAT'}">
                    <!-- Cas déjà postulé -->
                    <button th:if="${appliedOfferIds.contains(o['id'])}" class="btn-postuler" disabled>
                        ✅ Déjà postulé
                    </button>
                    <!-- Cas nouveau -->
                    <form th:unless="${appliedOfferIds.contains(o['id'])}" th:action="@{/postuler}" method="post" style="display:inline;">
                        <input type="hidden" name="offreId" th:value="${o['id']}">
                        <button type="submit" class="btn-postuler"> Postuler maintenant</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/liste-offre.js}"></script>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
