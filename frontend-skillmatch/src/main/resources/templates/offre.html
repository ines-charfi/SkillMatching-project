<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillMatch - Offres d'emploi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- CSS externe -->
    <link rel="stylesheet" th:href="@{/css/liste-offre.css}">
</head>
<body>

<!-- HEADER DYNAMIQUE -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="page-title"> Offres d'emploi</h1>
        <div th:if="${session.user_role == 'ENTREPRISE'}">
            <a href="/offre/nouveau" class="btn btn-primary rounded-pill">Publier une offre</a>
        </div>
    </div>

    <!-- Barre de recherche -->
    <div class="search-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Titre, compétence, entreprise..." onkeyup="filterOffres()">
        <select class="search-input" id="villeFilter" onchange="filterOffres()" style="max-width: 200px;">
            <option value="">Toutes les villes</option>
            <option value="Paris">Paris</option>
            <option value="Lyon">Lyon</option>
            <option value="Remote">Remote</option>
        </select>
    </div>

    <!-- Liste des offres (Injectée par JS) -->
    <div class="offres-list" id="offresList">
        <div class="text-center p-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2">Recherche des meilleures offres...</p>
        </div>
    </div>
</div>

<!-- ... reste du code HTML ... -->

<div id="notif" class="notification">✅ Candidature envoyée !</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<!-- 1. Déclaration des variables globales (Le pont Thymeleaf -> JS) -->
<script th:inline="javascript">
    const SESSION_DATA = {
        token: /*[[${session.user_token}]]*/ null,
        userId: /*[[${session.user_id}]]*/ null,
        userRole: /*[[${session.user_role}]]*/ null,
        apiBaseUrl: 'http://localhost:8080'
    };
</script>

<!-- 2. Appel du fichier JS externe -->
<script th:src="@{/js/liste-offre.js}"></script>

</body>
</html>
</body>
</html>
