<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillMatch - Modifier mon Profil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- CSS commun du site -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- CSS spécifique à la page profil candidat -->
    <link rel="stylesheet" th:href="@{/css/profil-candidat.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="profile-card p-4">
                <h3 class="fw-bold text-dark mb-1"><i class="bi bi-person-gear text-primary me-2"></i>Mon Profil Candidat</h3>
                <p class="text-muted small mb-4">Mettez à jour vos informations personnelles, votre CV et vos compétences pour optimiser le matching.</p>
                <hr class="mb-4">

                <form th:action="@{/profil/update}" method="POST" enctype="multipart/form-data">
                    <!-- Prénom et Nom -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Prénom</label>
                            <input type="text" class="form-control" name="prenom" th:value="${profil != null ? profil['prenom'] : ''}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Nom</label>
                            <input type="text" class="form-control" name="nom" th:value="${profil != null ? profil['nom'] : ''}" required>
                        </div>
                    </div>

                    <!-- Téléphone et Adresse -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Téléphone</label>
                            <input type="text" class="form-control" name="telephone" th:value="${profil != null ? profil['telephone'] : ''}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Adresse / Ville</label>
                            <input type="text" class="form-control" name="adresse" th:value="${profil != null ? profil['adresse'] : ''}">
                        </div>
                    </div>

                    <!-- Niveau d'études -->
                    <div class="mb-3">
                        <label class="form-label">Niveau Scolaire / Diplôme</label>
                        <select class="form-select" name="niveauScolaire">
                            <option value="" th:selected="${profil == null or profil['niveauScolaire'] == null}">Sélectionnez</option>
                            <option value="Bac" th:selected="${profil != null and profil['niveauScolaire'] == 'Bac'}">Bac</option>
                            <option value="Bac+2" th:selected="${profil != null and profil['niveauScolaire'] == 'Bac+2'}">Bac+2 (BTS, DUT)</option>
                            <option value="Bac+3" th:selected="${profil != null and profil['niveauScolaire'] == 'Bac+3'}">Bac+3 (Licence)</option>
                            <option value="Bac+5" th:selected="${profil != null and profil['niveauScolaire'] == 'Bac+5'}">Bac+5 (Master, Ingénieur)</option>
                        </select>
                    </div>

                    <!-- Bio -->
                    <div class="mb-3">
                        <label class="form-label">Bio / Présentation courte</label>
                        <textarea class="form-control" name="bio" rows="3" placeholder="Décrivez votre projet professionnel..." th:text="${profil != null ? profil['bio'] : ''}"></textarea>
                    </div>

                    <!-- Compétences -->
                    <div class="mb-3">
                        <label class="form-label">Compétences (séparées par des virgules)</label>
                        <input type="text" class="form-control" name="competences" placeholder="Ex: Java, Spring Boot, Angular" th:value="${profil != null ? profil['competences'] : ''}">
                    </div>

                    <!-- Liens réseaux sociaux -->
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label"><i class="bi bi-linkedin text-primary me-1"></i>URL LinkedIn</label>
                            <input type="url" class="form-control" name="linkedinUrl" placeholder="https://linkedin.com/in/..." th:value="${profil != null ? profil['linkedinUrl'] : ''}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label"><i class="bi bi-github me-1"></i>URL Portfolio / GitHub</label>
                            <input type="url" class="form-control" name="portfolioUrl" placeholder="https://github.com/..." th:value="${profil != null ? profil['portfolioUrl'] : ''}">
                        </div>
                    </div>

                    <!-- Upload fichiers + affichage photo actuelle + aperçu -->
                    <div class="p-3 bg-light rounded-3 mb-4 border">
                        <h6 class="fw-bold mb-3"><i class="bi bi-file-earmark-arrow-up-fill me-2"></i>Documents & Médias</h6>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Mettre à jour le CV (PDF)</label>
                                <input type="file" class="form-control form-control-sm" name="cv" accept=".pdf">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-muted">Photo de profil (JPEG, PNG)</label>
                                <input type="file" class="form-control form-control-sm" name="photo" accept="image/*">
                            </div>

                                <!-- Aperçu de la nouvelle photo -->
                                <div class="mt-2 text-center" id="newPhotoPreview" style="display: none;">
                                    <img id="previewImg" class="rounded-circle shadow-sm" style="width: 80px; height: 80px; object-fit: cover; border: 2px solid #10b981;">
                                    <div class="small text-success mt-1">Nouvelle photo</div>
                                </div>
                            </div>
                        </div>


                    <!-- Boutons d'action -->
                    <div class="d-flex justify-content-end gap-2">
                        <a href="/dashboard-candidat" class="btn btn-light rounded-pill px-4 btn-sm fw-bold">Annuler</a>
                        <button type="submit" class="btn btn-primary rounded-pill px-4 btn-sm fw-bold shadow-sm">
                            <i class="bi bi-check-lg me-1"></i> Enregistrer les modifications
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/profil-candidat.js}"></script>
</body>
</html>
