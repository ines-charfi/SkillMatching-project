<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Profil - SkillMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8fafc; padding: 40px 0; }
        .form-card { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        label { font-weight: 600; font-size: 0.9rem; color: #475569; }
    </style>
</head>
<body>
<div class="container" style="max-width: 800px;">
    <div class="form-card">
        <h2 class="fw-bold mb-4">👤 Mettre à jour mon profil</h2>

        <form th:action="@{/profil/update}" method="post" enctype="multipart/form-data">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Prénom</label>
                    <input type="text" name="prenom" class="form-control" th:value="${profil['prenom']}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Nom</label>
                    <input type="text" name="nom" class="form-control" th:value="${profil['nom']}" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Téléphone</label>
                    <input type="tel" name="telephone" class="form-control" th:value="${profil['telephone']}">
                </div>
                <div class="col-md-6 mb-3">
                    <label>Ville</label>
                    <input type="text" name="ville" class="form-control" th:value="${profil['ville']}">
                </div>
            </div>

            <div class="mb-3">
                <label>Adresse complète</label>
                <input type="text" name="adresse" class="form-control" th:value="${profil['adresse']}">
            </div>

            <div class="mb-3">
                <label>Bio professionnelle</label>
                <textarea name="bio" class="form-control" rows="3" th:text="${profil['bio']}"></textarea>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Compétences (virgules)</label>
                    <input type="text" name="competences" class="form-control" th:value="${profil['competences']}">
                </div>
                <div class="col-md-6 mb-3">
                    <label>Niveau d'études</label>
                    <select name="niveauScolaire" class="form-select">
                        <option value="Bac+2" th:selected="${profil['niveauScolaire'] == 'Bac+2'}">Bac+2</option>
                        <option value="Bac+3" th:selected="${profil['niveauScolaire'] == 'Bac+3'}">Bac+3</option>
                        <option value="Bac+5" th:selected="${profil['niveauScolaire'] == 'Bac+5'}">Bac+5</option>
                    </select>
                </div>
            </div>

            <div class="mb-4">
                <label>Votre CV (PDF)</label>
                <input type="file" name="cv" class="form-control" accept=".pdf">
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">💾 Enregistrer les modifications</button>
            <a href="/dashboard-candidat" class="btn btn-link w-100 mt-2">Annuler</a>
        </form>
    </div>
</div>
</body>
</html>
