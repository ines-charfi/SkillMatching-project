<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Talent Pool - SkillMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; }
        .talent-card { background: white; border-radius: 20px; padding: 25px; transition: 0.3s; border: none; height: 100%; }
        .talent-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .skill-tag { background: #eef2ff; color: #4f46e5; padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 600; margin: 2px; display: inline-block; }
    </style>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container py-5">
    <h2 class="fw-bold mb-4">🎯 Talent Pool : Découvrez nos candidats</h2>

    <div class="row g-4">
        <div th:each="c : ${candidats}" class="col-md-6 col-lg-4">
            <div class="talent-card shadow-sm">
                <div class="d-flex align-items-center gap-3 mb-3">
                    <div class="rounded-3 bg-primary text-white p-3 fw-bold" th:text="${#strings.substring(c.prenom,0,1) + #strings.substring(c.nom,0,1)}">PD</div>
                    <div>
                        <h5 class="fw-bold mb-0" th:text="${c.prenom + ' ' + c.nom}">Nom Prénom</h5>
                        <span class="small text-primary fw-bold" th:text="${c.niveauScolaire}">Bac+5</span>
                    </div>
                </div>
                <p class="small text-muted mb-3" th:text="${#strings.abbreviate(c.bio, 120)}">Bio...</p>
                <div class="mb-4">
                    <span th:each="s : ${#strings.arraySplit(c.competences, ',')}" class="skill-tag" th:text="${s}">Java</span>
                </div>
                <button class="btn btn-outline-primary btn-sm w-100 rounded-pill">Voir le profil complet</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
