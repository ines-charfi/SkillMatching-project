<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talent Pool - SkillMatch</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Votre nouveau fichier CSS -->
    <link rel="stylesheet" th:href="@{/css/talent-pool.css}">
</head>
<body>

<!-- HEADER -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold m-0">Talent Pool : Découvrez nos candidats</h2>
        <span class="badge bg-white text-dark shadow-sm p-2 px-3 rounded-pill" th:text="${candidats.size() + ' profils disponibles'}">0 profils</span>
    </div>

    <div class="row g-4">
        <!-- Itération sur les candidats -->
        <div th:each="c : ${candidats}" class="col-md-6 col-lg-4">
            <div class="talent-card shadow-sm">

                <div class="d-flex align-items-center gap-3 mb-3">
                    <!-- Initiales stylisées -->
                    <div class="talent-avatar"
                         th:text="${#strings.substring(c.prenom,0,1) + #strings.substring(c.nom,0,1)}">
                        SM
                    </div>
                    <div>
                        <h5 class="fw-bold mb-0" th:text="${c.prenom + ' ' + c.nom}">Nom Prénom</h5>
                        <span class="small text-primary fw-bold" th:text="${c.niveauScolaire}">Niveau</span>
                    </div>
                </div>

                <!-- Bio avec limitation de caractères -->
                <p class="small text-muted mb-3" th:text="${#strings.abbreviate(c.bio, 120)}">
                    Description du profil...
                </p>

                <!-- Liste des compétences -->
                <div class="mb-4">
                    <span th:each="s : ${#strings.arraySplit(c.competences, ',')}"
                          class="skill-tag"
                          th:text="${s.trim()}">Java</span>
                </div>

                <!-- Bouton d'action -->
                <button class="btn btn-outline-primary btn-sm w-100 rounded-pill">
                    Voir le profil complet
                </button>
            </div>
        </div>
    </div>
</div>

<!-- FOOTER (Optionnel) -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
