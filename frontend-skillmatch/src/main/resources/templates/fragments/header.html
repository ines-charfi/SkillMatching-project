<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="header">
    <nav class="dashboard-navbar">
        <div class="dashboard-nav-container">
            <!-- Logo cliquable -->
            <a th:href="@{/}" class="dashboard-logo-link">
                <img th:src="@{/img/logo.png}" alt="SkillMatch Logo" class="dashboard-logo-img">
            </a>
            <div class="dashboard-nav-links">
                <a th:href="@{/dashboard-candidat}" class="dashboard-nav-link">Tableau de bord</a>
                <th:block th:if="${session.user_role == 'CANDIDAT'}">
                    <a th:href="@{/mes-candidatures}" class="dashboard-nav-link">Mes candidatures</a>
                    <a th:href="@{/offre}" class="dashboard-nav-link">Trouver un job</a>
                </th:block>
                <th:block th:if="${session.user_role == 'ENTREPRISE'}">

                    <a th:href="@{/offre/nouveau}" class="dashboard-nav-link">Publier une offre</a>
                    <a th:href="@{/candidats}" class="dashboard-nav-link">Rechercher des talents</a>
                </th:block>
            </div>
            <div class="dashboard-user-area">
                <div class="dashboard-user-info d-none d-md-block">
                    <div class="dashboard-user-email" th:text="${session.user_email}">admin@skillmatch.com</div>
                    <span class="dashboard-user-role" th:text="${session.user_role}">CANDIDAT</span>
                </div>
                <div class="dashboard-avatar" th:text="${session.user_initials}">?</div>
                <a th:href="@{/logout-user}" class="dashboard-logout" title="Déconnexion">
                    <i class="bi bi-box-arrow-right"></i>
                </a>
            </div>
        </div>
    </nav>
</th:block>
</html>
