<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillMatch - Publier une offre</title>
    <!-- Bootstrap + Icons + Google Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- CSS commun du site (global) -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- CSS spécifique à la page création d'offre -->
    <link rel="stylesheet" th:href="@{/css/offre.css}">
    <!-- Le header et footer utiliseront les mêmes styles -->
</head>
<body>

<!-- Inclusion du fragment header (navigation dynamique) -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- Conteneur principal -->
<div class="container offre-wrapper">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="offre-card">
                <h2 class="fw-bold mb-4"> Publier une nouvelle opportunité</h2>
                <p class="text-muted mb-4">Décrivez le poste et les compétences requises pour trouver les meilleurs talents grâce au matching.</p>

                <form th:action="@{/offre/creer}" method="post">
                    <div class="mb-4">
                        <label class="form-label fw-bold">Titre de l'offre</label>
                        <input type="text" name="titre" class="form-control form-control-lg" placeholder="Ex: Développeur Full Stack Java/React" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Description complète</label>
                        <textarea name="description" class="form-control" rows="6" placeholder="Quelles seront les missions du candidat ?" required></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-bold">Niveau d'études requis</label>
                            <select name="niveauRequis" class="form-select">
                                <option value="Bac+2">Bac+2</option>
                                <option value="Bac+3">Bac+3 (Licence)</option>
                                <option value="Bac+5" selected>Bac+5 (Master / Ingénieur)</option>
                                <option value="Doctorat">Doctorat</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-bold">Rémunération annuelle</label>
                            <input type="text" name="salaire" class="form-control" placeholder="Ex: 45k - 55k €">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Compétences techniques (Séparées par des virgules)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-tags text-primary"></i></span>
                            <input type="text" name="competencesRequises" class="form-control border-start-0" placeholder="Java, Spring Boot, React, Docker...">
                        </div>
                        <div class="form-text mt-2">L'algorithme utilisera ces mots-clés pour calculer le score de matching.</div>
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn btn-primary btn-submit">Diffuser l'offre maintenant</button>
                        <a th:href="@{/dashboard-entreprise}" class="btn btn-light btn-cancel">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Inclusion du fragment footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
