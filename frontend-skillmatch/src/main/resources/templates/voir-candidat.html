<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillMatch - Profil Candidat</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS commun du site (variables, reset, navbar, footer) -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- CSS spécifique à la consultation du profil candidat -->
    <link rel="stylesheet" th:href="@{/css/voir-candidat.css}">
</head>
<body>

<!-- Header avec navigation (logo et liens dynamiques) -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="main-content container my-5">

    <!-- Bouton retour (peut être conservé, ou retiré si le header a déjà un lien dashboard) -->
    <div class="mb-4">
        <a th:href="@{/dashboard-entreprise}" class="btn btn-sm btn-light btn-pill border px-3 text-secondary shadow-sm">
            <i class="bi bi-arrow-left me-2"></i>Retour au tableau de bord
        </a>
    </div>

    <div class="card card-custom overflow-hidden">
        <div class="card-header bg-skillmatch text-white py-4 px-4 border-0 d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center">
                <div class="bg-white text-primary rounded-circle p-2 me-3 d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;">
                    <i class="bi bi-person-badge fs-4 text-skillmatch" style="color: #2b247c;"></i>
                </div>
                <div>
                    <h4 class="mb-0 fw-bold" th:text="${candidat.get('prenom')} + ' ' + ${candidat.get('nom')}">Dossier Candidat</h4>
                    <small class="text-white-50">Consultation du profil professionnel</small>
                </div>
            </div>
            <span class="badge bg-white text-dark btn-pill px-3 py-2 fw-semibold shadow-sm" th:text="${candidat.get('niveauScolaire')} ?: 'Diplôme non spécifié'">Niveau</span>
        </div>

        <div class="card-body p-4 p-md-5">
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="info-label"><i class="bi bi-person me-1"></i> Prénom</label>
                    <div class="info-value" th:text="${candidat.get('prenom')} ?: 'Non renseigné'"></div>
                </div>
                <div class="col-md-6">
                    <label class="info-label"><i class="bi bi-person-fill me-1"></i> Nom</label>
                    <div class="info-value" th:text="${candidat.get('nom')} ?: 'Non renseigné'"></div>
                </div>
                <div class="col-md-6">
                    <label class="info-label"><i class="bi bi-telephone me-1"></i> Numéro de téléphone</label>
                    <div class="info-value" th:text="${candidat.get('telephone')} ?: 'Non renseigné'"></div>
                </div>
                <div class="col-md-6">
                    <label class="info-label"><i class="bi bi-mortarboard me-1"></i> Niveau académique maximal</label>
                    <div class="info-value" th:text="${candidat.get('niveauScolaire')} ?: 'Non renseigné'"></div>
                </div>
                <div class="col-12">
                    <label class="info-label"><i class="bi bi-geo-alt me-1"></i> Adresse / Ville de résidence</label>
                    <div class="info-value" th:text="${candidat.get('adresse')} ?: 'Non renseigné'"></div>
                </div>
                <div class="col-md-6">
                    <label class="info-label"><i class="bi bi-linkedin me-1 text-primary"></i> Profil LinkedIn</label>
                    <div class="info-value">
                        <span th:if="${candidat.get('linkedinUrl') == null || candidat.get('linkedinUrl') == ''}" class="text-muted fw-normal">Non renseigné</span>
                        <a th:if="${candidat.get('linkedinUrl') != null && candidat.get('linkedinUrl') != ''}"
                           th:href="${candidat.get('linkedinUrl')}" target="_blank" class="text-decoration-none text-primary" th:text="${candidat.get('linkedinUrl')}"></a>
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="info-label"><i class="bi bi-globe me-1 text-success"></i> Portfolio numérique</label>
                    <div class="info-value">
                        <span th:if="${candidat.get('portfolioUrl') == null || candidat.get('portfolioUrl') == ''}" class="text-muted fw-normal">Non renseigné</span>
                        <a th:if="${candidat.get('portfolioUrl') != null && candidat.get('portfolioUrl') != ''}"
                           th:href="${candidat.get('portfolioUrl')}" target="_blank" class="text-decoration-none text-success" th:text="${candidat.get('portfolioUrl')}"></a>
                    </div>
                </div>
                <div class="col-12">
                    <label class="info-label"><i class="bi bi-tags me-1"></i> Compétences clés</label>
                    <div class="info-value border-0" th:text="${candidat.get('competences')} ?: 'Aucune compétence renseignée'"></div>
                </div>
                <div class="col-12">
                    <label class="info-label"><i class="bi bi-blockquote-left me-1"></i> Biographie / Présentation</label>
                    <div class="p-3 bg-light rounded border text-secondary" style="line-height: 1.6;" th:text="${candidat.get('bio')} ?: 'Pas de biographie rédigée.'"></div>
                </div>
                <div class="col-12 mt-5 pt-3 border-top d-flex align-items-center justify-content-between flex-wrap g-3">
                    <div>
                        <h5 class="mb-1 fw-bold text-dark">Pièce jointe disponible</h5>
                        <p class="text-muted small mb-0">Vous pouvez télécharger le CV original au format PDF fourni par le candidat.</p>
                    </div>
                    <a th:href="@{/api/candidats/download/cv/{userId}(userId=${candidat.get('userId')})}"
                       class="btn btn-danger btn-pill px-4 py-2 fw-semibold shadow-sm">
                        <i class="bi bi-file-earmark-pdf-fill me-2"></i> Télécharger le CV (PDF)
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
