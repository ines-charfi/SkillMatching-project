spring.application.name=frontend-skillmatch
# ============================================
# Emplacement : src/main/resources/application.properties
# ============================================

# Serveur
server.port=8086

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# API Gateway URL
api.gateway.url=http://localhost:8080

# Consul (optionnel pour le frontend)
spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
spring.cloud.consul.discovery.enabled=false

# Logging
logging.level.com.ines.frontend_skillmatch=DEBUG


spring.cloud.consul.discovery.service-name=${spring.application.name}
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${server.port}
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=15s
spring.cloud.consul.discovery.fail-fast=false
spring.cloud.consul.discovery.register-health-check=true